<script>
function getPrompt() {
  const clean = value => String(value || "").trim();
  const join = items => items.filter(Boolean).join(", ");

  const maxChars = 1000;

  const coreParts = [
    `${state.mode} / ${state.model}.`,
    `Main genre: ${state.genre}.`,
    state.fusionGenres.length ? `Fuse with: ${join(state.fusionGenres)}.` : "",
    `Style: ${clean(state.subStyle)}.`,
    state.bpm ? `Tempo: ${state.bpm} BPM.` : "Keep original tempo.",
    state.key ? `Key: ${state.key}.` : "Keep original key.",
    state.eraYear ? `Era: inspired by ${state.eraYear}, no artist/song copying.` : "",
    clean(state.atmosphere) ? `Atmosphere: ${clean(state.atmosphere)}.` : "",
    clean(state.emotionIntent) ? `Emotion: ${clean(state.emotionIntent)}.` : "",
    state.percussionMode === "Sin percusión / solo melodía"
      ? "No drums or percussion; focus on melody, harmony, atmosphere and sampleable layers."
      : "Drums/percussion allowed, tasteful and supportive.",
    state.instruments.length ? `Instruments/textures: ${join(state.instruments)}.` : "",
    clean(state.customInstruction)
      ? `Custom: ${clean(state.customInstruction)}. Make it natural and coherent.`
      : "",
    `Vocal: ${translateValue(state.vocalOption)}.`,
    `Audio influence: ${translateValue(state.audioInfluence)}. Creativity: ${translateValue(state.creativity)}.`
  ];

  const optionalParts = [
    clean(state.preserve) ? `Preserve: ${clean(state.preserve)}.` : "",
    clean(state.structure) ? `Structure: ${clean(state.structure)}.` : "",
    clean(state.mood) ? `Mood: ${clean(state.mood)}.` : "",
    clean(state.addElements) ? `Add: ${clean(state.addElements)}.` : "",
    clean(state.mixDirection) ? `Mix: ${clean(state.mixDirection)}.` : "",
    clean(state.avoid) ? `Avoid: ${clean(state.avoid)}.` : "",
    clean(state.stemGoal) ? `Stem goal: ${clean(state.stemGoal)}.` : "",
    clean(state.notes) ? `Notes: ${clean(state.notes)}.` : ""
  ];

  let prompt = "";

  function addPart(part) {
    if (!part) return;
    const candidate = prompt ? `${prompt} ${part}` : part;

    if (candidate.length <= maxChars) {
      prompt = candidate;
    }
  }

  coreParts.forEach(addPart);
  optionalParts.forEach(addPart);

  return prompt
    .replaceAll("\n", " ")
    .replace(/\s+/g, " ")
    .trim();
}

function renderPrompt() {
  const prompt = getPrompt();
  promptOutput.textContent = prompt;
  charCounter.textContent = `${prompt.length}/1000 caracteres`;
}
</script>
